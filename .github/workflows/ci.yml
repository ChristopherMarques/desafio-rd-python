name: Continuous Integration

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

jobs:
  backend-checks:
    name: Backend CI (Python / FastAPI)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      - name: Configurar Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt

      - name: Linter com Ruff
        run: |
          cd backend
          ruff check .

      - name: Checagem Estática de Tipos com Mypy
        run: |
          cd backend
          mypy app

      - name: Executar Testes Unitários e E2E com Pytest
        run: |
          cd backend
          pytest --cov=app --cov-report=xml --cov-report=term-missing

  frontend-checks:
    name: Frontend CI (React / TypeScript / Vite)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Instalar Dependências do Frontend
        run: |
          pnpm install --no-frozen-lockfile

      - name: Executar Testes do Frontend com Vitest
        run: |
          pnpm --filter mars-probe-frontend test

      - name: Checagem de Tipos e Build
        run: |
          pnpm --filter mars-probe-frontend build
